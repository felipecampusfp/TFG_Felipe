<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LavanderApp — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & tokens ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand-deep:   #1a2744;
      --brand-mid:    #253460;
      --brand-accent: #3e85f5;
      --brand-light:  #e8f0fe;
      --surface:      #ffffff;
      --surface-alt:  #f5f7fa;
      --border:       #e2e6ef;
      --text-main:    #1a2744;
      --text-soft:    #6b7799;
      --text-hint:    #9aa3be;
      --error-bg:     #fff1f0;
      --error-border: #fca5a5;
      --error-text:   #991b1b;
      --success-bg:   #f0fdf4;
      --success-text: #166534;
      --radius:       14px;
      --shadow-card:  0 8px 40px rgba(26,39,68,.12);
      --shadow-btn:   0 4px 18px rgba(62,133,245,.35);
      --transition:   .22s cubic-bezier(.4,0,.2,1);
    }

    body {
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      background: var(--brand-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* ── Decorative background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 90%, rgba(62,133,245,.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 90% 10%, rgba(100,160,255,.14) 0%, transparent 60%),
        linear-gradient(160deg, #1a2744 0%, #0f1a38 100%);
      z-index: 0;
    }

    .bubbles {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(62,133,245,.06);
      border: 1px solid rgba(62,133,245,.1);
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(0) scale(1);   opacity: .6; }
      50%  { transform: translateY(-40px) scale(1.04); opacity: 1; }
      100% { transform: translateY(0) scale(1);   opacity: .6; }
    }

    /* ── Card ── */
    .login-wrap {
      position: relative; z-index: 1;
      display: flex;
      width: 100%;
      max-width: 460px;
    }

    .card {
      width: 100%;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    /* ── Card header ── */
    .card-head {
      background: var(--brand-deep);
      padding: 2.4rem 2.4rem 2rem;
      text-align: center;
      position: relative;
    }
    .card-head::after {
      content: '';
      position: absolute; bottom: -1px; left: 0; right: 0;
      height: 24px;
      background: var(--surface);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }

    .logo-ring {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand-accent) 0%, #6ba3ff 100%);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.1rem;
      box-shadow: 0 4px 20px rgba(62,133,245,.45);
    }
    .logo-ring svg { width: 34px; height: 34px; }

    .brand-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.7rem;
      color: #ffffff;
      letter-spacing: -.5px;
    }
    .brand-sub {
      font-size: .82rem;
      color: rgba(255,255,255,.55);
      margin-top: .25rem;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    /* ── Card body ── */
    .card-body {
      padding: 2rem 2.4rem 2.4rem;
    }

    .form-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 1.6rem;
      text-align: center;
    }

    /* ── Fields ── */
    .field {
      margin-bottom: 1.1rem;
    }
    .field label {
      display: block;
      font-size: .8rem;
      font-weight: 500;
      color: var(--text-soft);
      margin-bottom: .42rem;
      letter-spacing: .4px;
      text-transform: uppercase;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap .icon {
      position: absolute; left: .9rem; top: 50%; transform: translateY(-50%);
      color: var(--text-hint);
      pointer-events: none;
      transition: color var(--transition);
    }
    .input-wrap input {
      width: 100%;
      padding: .78rem 1rem .78rem 2.6rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: .95rem;
      color: var(--text-main);
      background: var(--surface-alt);
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      outline: none;
    }
    .input-wrap input:focus {
      border-color: var(--brand-accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(62,133,245,.12);
    }
    .input-wrap input:focus ~ .icon,
    .input-wrap:focus-within .icon {
      color: var(--brand-accent);
    }
    .input-wrap input.error {
      border-color: #fca5a5;
      background: var(--error-bg);
    }

    /* eye toggle */
    .eye-btn {
      position: absolute; right: .85rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-hint);
      padding: .2rem;
      transition: color var(--transition);
      display: flex; align-items: center;
    }
    .eye-btn:hover { color: var(--brand-accent); }

    /* ── Row: remember + forgot ── */
    .form-extras {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: .2rem 0 1.5rem;
    }
    .remember {
      display: flex; align-items: center; gap: .45rem;
      font-size: .83rem; color: var(--text-soft); cursor: pointer;
      user-select: none;
    }
    .remember input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: var(--brand-accent);
      cursor: pointer;
    }
    .forgot {
      font-size: .83rem;
      color: var(--brand-accent);
      text-decoration: none;
      transition: opacity var(--transition);
    }
    .forgot:hover { opacity: .75; }

    /* ── Alerts ── */
    .alert {
      display: none;
      align-items: flex-start;
      gap: .6rem;
      padding: .8rem 1rem;
      border-radius: 10px;
      font-size: .88rem;
      margin-bottom: 1.2rem;
      animation: slideIn .25s ease;
    }
    .alert.show { display: flex; }
    .alert.error   { background: var(--error-bg);   border: 1px solid var(--error-border); color: var(--error-text); }
    .alert.success { background: var(--success-bg); border: 1px solid #bbf7d0;             color: var(--success-text); }
    @keyframes slideIn {
      from { opacity:0; transform: translateY(-8px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* ── Button ── */
    .btn-login {
      width: 100%;
      padding: .88rem;
      background: linear-gradient(135deg, #2d6ff0 0%, var(--brand-accent) 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
      display: flex; align-items: center; justify-content: center; gap: .55rem;
      position: relative; overflow: hidden;
    }
    .btn-login:hover:not(:disabled) {
      opacity: .93;
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(62,133,245,.45);
    }
    .btn-login:active:not(:disabled) { transform: translateY(0); }
    .btn-login:disabled {
      opacity: .6; cursor: not-allowed; transform: none; box-shadow: none;
    }

    /* spinner */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .btn-login.loading .spinner    { display: block; }
    .btn-login.loading .btn-text   { display: none; }
    .btn-login.loading .btn-icon   { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: .8rem;
      margin: 1.4rem 0 1rem;
    }
    .divider span { flex:1; height: 1px; background: var(--border); }
    .divider p { font-size: .78rem; color: var(--text-hint); white-space: nowrap; }

    /* ── Role badge ── */
    .roles-hint {
      display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap;
    }
    .badge {
      display: inline-flex; align-items: center; gap: .3rem;
      font-size: .75rem; font-weight: 500;
      padding: .3rem .75rem;
      border-radius: 99px;
      background: var(--brand-light);
      color: var(--brand-accent);
      border: 1px solid rgba(62,133,245,.2);
    }
    .badge svg { width: 12px; height: 12px; }

    /* ── Footer ── */
    .card-foot {
      padding: 1rem 2.4rem;
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: .78rem;
      color: var(--text-hint);
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card-head { padding: 2rem 1.5rem 1.8rem; }
      .card-body { padding: 1.6rem 1.5rem 2rem; }
      .card-foot { padding: .9rem 1.5rem; }
    }
  </style>
</head>
<body>

<!-- Decorative bubbles -->
<div class="bubbles" aria-hidden="true"></div>

<div class="login-wrap">
  <div class="card">

    <!-- Header -->
    <div class="card-head">
      <div class="logo-ring">
        <!-- Washing machine icon -->
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="6" width="36" height="36" rx="6" stroke="#fff" stroke-width="2.5"/>
          <rect x="6" y="6" width="36" height="10" rx="6" fill="rgba(255,255,255,.15)" stroke="#fff" stroke-width="2.5"/>
          <circle cx="24" cy="29" r="8" stroke="#fff" stroke-width="2.5"/>
          <circle cx="24" cy="29" r="3.5" stroke="rgba(255,255,255,.6)" stroke-width="2"/>
          <circle cx="11" cy="11" r="1.5" fill="#fff" opacity=".7"/>
          <circle cx="16" cy="11" r="1.5" fill="#fff" opacity=".7"/>
          <path d="M20 29c0-2.2 1.8-4 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-name">LavanderApp</div>
      <div class="brand-sub">Sistema de gestión</div>
    </div>

    <!-- Body -->
    <div class="card-body">
      <p class="form-title">Iniciar sesión</p>

      <!-- Alert box -->
      <div class="alert error" id="alert-error" role="alert">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20" style="flex-shrink:0;margin-top:1px">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span id="alert-msg">Correo o contraseña incorrectos.</span>
      </div>

      <div class="alert success" id="alert-success" role="status">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20" style="flex-shrink:0;margin-top:1px">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
        <span>Acceso correcto. Redirigiendo…</span>
      </div>

      <!-- Form -->
      <form id="login-form" novalidate>

        <!-- Email -->
        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="input-wrap">
            <svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" id="email" name="email"
                   placeholder="usuario@lavanderia.com"
                   autocomplete="username email"
                   required />
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input type="password" id="password" name="password"
                   placeholder="••••••••"
                   autocomplete="current-password"
                   required />
            <button type="button" class="eye-btn" id="eye-btn" aria-label="Mostrar contraseña">
              <!-- Eye closed (default) -->
              <svg id="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              <!-- Eye open (hidden) -->
              <svg id="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Extras -->
        <div class="form-extras">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember" />
            Recuérdame
          </label>
          <a href="#" class="forgot" id="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-login" id="btn-login">
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <span class="btn-text">Entrar</span>
          <div class="spinner" aria-hidden="true"></div>
        </button>

      </form>

      <!-- Roles hint -->
      <div class="divider">
        <span></span>
        <p>Niveles de acceso</p>
        <span></span>
      </div>
      <div class="roles-hint">
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Administrador
        </span>
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Empleado
        </span>
      </div>
    </div>

    <!-- Footer -->
    <div class="card-foot">
      LavanderApp &nbsp;·&nbsp; TFG Gestión de Lavandería &nbsp;·&nbsp; 2026
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   Decorative bubbles
══════════════════════════════════════════════════════════ */
(function() {
  const wrap = document.querySelector('.bubbles');
  const sizes  = [60, 90, 120, 150, 80, 110, 70, 140];
  const speeds = [6, 8, 10, 7, 9, 11, 8, 6];
  sizes.forEach((s, i) => {
    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.cssText = `
      width:${s}px; height:${s}px;
      left:${Math.random()*100}%;
      top:${20 + Math.random()*70}%;
      animation-duration:${speeds[i]}s;
      animation-delay:${-Math.random()*10}s;
    `;
    wrap.appendChild(b);
  });
})();

/* ══════════════════════════════════════════════════════════
   Eye toggle (show / hide password)
══════════════════════════════════════════════════════════ */
const eyeBtn   = document.getElementById('eye-btn');
const pwdInput = document.getElementById('password');
const eyeOff   = document.getElementById('eye-off');
const eyeOn    = document.getElementById('eye-on');

eyeBtn.addEventListener('click', () => {
  const visible = pwdInput.type === 'text';
  pwdInput.type = visible ? 'password' : 'text';
  eyeOff.style.display = visible ? '' : 'none';
  eyeOn.style.display  = visible ? 'none' : '';
  eyeBtn.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
});

/* ══════════════════════════════════════════════════════════
   Alert helpers
══════════════════════════════════════════════════════════ */
const alertError   = document.getElementById('alert-error');
const alertMsg     = document.getElementById('alert-msg');
const alertSuccess = document.getElementById('alert-success');

function showError(msg) {
  alertSuccess.classList.remove('show');
  alertMsg.textContent = msg;
  alertError.classList.add('show');
}
function showSuccess() {
  alertError.classList.remove('show');
  alertSuccess.classList.add('show');
}
function hideAlerts() {
  alertError.classList.remove('show');
  alertSuccess.classList.remove('show');
}

/* ══════════════════════════════════════════════════════════
   Form submit — login simulation
   En producción: sustituir el bloque simulateLogin()
   por una llamada fetch al endpoint /api/auth/login
══════════════════════════════════════════════════════════ */
const form    = document.getElementById('login-form');
const btnLogin = document.getElementById('btn-login');
const emailInput = document.getElementById('email');

function setLoading(on) {
  btnLogin.classList.toggle('loading', on);
  btnLogin.disabled = on;
}

function markFieldError(input, hasError) {
  input.classList.toggle('error', hasError);
}

/* ── Llamada real al backend PHP ── */
async function fetchLogin(email, password) {
  const res = await fetch('/lavanderia-app/backend/login.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Credenciales incorrectas');
  return data;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAlerts();

  const email    = emailInput.value.trim();
  const password = pwdInput.value;

  /* Validación básica cliente */
  let valid = true;

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    markFieldError(emailInput, true);
    valid = false;
  } else {
    markFieldError(emailInput, false);
  }

  if (!password || password.length < 6) {
    markFieldError(pwdInput, true);
    valid = false;
  } else {
    markFieldError(pwdInput, false);
  }

  if (!valid) {
    showError('Por favor, revisa los campos marcados.');
    return;
  }

  setLoading(true);

  try {
    const user = await fetchLogin(email, password);

    /* Guardar sesión (en producción: guardar JWT en httpOnly cookie o sessionStorage) */
    const storage = document.getElementById('remember').checked
      ? localStorage : sessionStorage;
    storage.setItem('lav_user', JSON.stringify({ email: user.email, rol: user.rol }));

    showSuccess();

    /* Redirigir según rol */
    setTimeout(() => {
      const destino = user.rol === 'ADMIN'
        ? 'admin_dashboard.html'
        : 'empleado_dashboard.html';
      window.location.href = destino;
    }, 1200);

  } catch (err) {
    setLoading(false);
    markFieldError(emailInput, true);
    markFieldError(pwdInput, true);
    showError(err.message || 'Correo o contraseña incorrectos.');
  }
});

/* Limpiar error visual al escribir */
[emailInput, pwdInput].forEach(input => {
  input.addEventListener('input', () => {
    markFieldError(input, false);
    if (!alertSuccess.classList.contains('show')) hideAlerts();
  });
});

/* Enlace "olvidé contraseña" */
document.getElementById('forgot-link').addEventListener('click', (e) => {
  e.preventDefault();
  alert('Por implementar: envío de correo de recuperación a través del backend.');
});
</script>
</body>
</html>
